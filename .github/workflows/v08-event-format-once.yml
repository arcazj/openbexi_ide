name: IDE v0.8 monitoring formatter (one-shot)
on:
  push:
    branches: ['feature/v0.8-spell-server-client']
    paths: ['.github/workflows/v08-event-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.repository == 'arcazj/openbexi_ide'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Format only modified v0.8 client and tests
        run: |
          set -euo pipefail
          python -m pip install ruff==0.14.1
          python -m ruff format src/openbexi_runtime/spell_server_client.py tests/test_spell_server_client.py
          python -m ruff check src/openbexi_runtime/spell_server_client.py tests/test_spell_server_client.py
          git add src/openbexi_runtime/spell_server_client.py tests/test_spell_server_client.py
          if ! git diff --cached --quiet; then
            git -c user.name='openbexi-ci' -c user.email='17037788+arcazj@users.noreply.github.com' commit -m 'style(v0.8): format monitoring replay client'
            git push origin HEAD:feature/v0.8-spell-server-client
          fi
