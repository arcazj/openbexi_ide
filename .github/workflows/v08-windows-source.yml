name: v0.8 companion IDE dev7 Windows source qualification
on:
  push:
    branches: [qualification/v08-windows-dev7]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v08-windows-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout the original pinned plugin SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_spell_plugin
          ref: 08ee0045635131d60be06a8a31e0ae8b90d7df65
          path: .qualification/companion-plugin
          persist-credentials: false
      - name: Verify unchanged candidate source and record platform
        run: |
          mkdir -p .qualification/windows
          python scripts/qualify_v08_windows_identity.py before
      - name: Install original pinned desktop and test dependencies
        run: |
          python -m pip install '.[desktop,test]' ruff==0.14.1
          python -m pip install --no-deps ./.qualification/companion-plugin
          python -m pip freeze > .qualification/windows/pip-freeze.txt
      - name: Run unchanged full source suite with its original platform exclusions
        run: |
          set -o pipefail
          python -m pytest tests -q -W error --tb=short -p scripts.v08_windows_journal --junitxml=.qualification/windows/source.xml 2>&1 | tee .qualification/windows/source.log
      - name: Build and verify installed client bytes
        if: success()
        run: |
          python -m pip wheel --no-deps . --wheel-dir .qualification/windows/wheels
          python -m venv .qualification/windows-installed
          .qualification/windows-installed/Scripts/python.exe -c "import pathlib,subprocess,sys; w=next(pathlib.Path('.qualification/windows/wheels').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install',str(w)+'[desktop]'])"
          .qualification/windows-installed/Scripts/python.exe -I -m openbexi_runtime.spell_server_client --help > .qualification/windows/installed-client-help.txt
          .qualification/windows-installed/Scripts/python.exe -I -c "import importlib.metadata as m; assert m.version('openbexi-ide') == '1.2.1.dev7'"
          .qualification/windows-installed/Scripts/python.exe -I -c "from PySide6.QtWidgets import QApplication; from PySide6.QtCore import QTimer; from openbexi_ide.app import main; a=QApplication([]); QTimer.singleShot(1500,a.quit); raise SystemExit(main([]))" > .qualification/windows/installed-public-startup.log 2>&1
          .qualification/windows-installed/Scripts/python.exe -I scripts/qualify_v08_windows_identity.py after-installed
      - name: Verify source and installed dependency RECORD payloads after execution
        if: always()
        run: python scripts/qualify_v08_windows_identity.py after
      - name: Retain raw outcomes including failures and exclusions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v08-ide-dev7-windows-${{ github.sha }}
          path: .qualification/windows/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
