name: v0.8 IDE client and existing IDE regressions
on:
  push:
    branches: [feature/v0.8-spell-server-client]
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/v08-client.yml']
permissions:
  contents: read
jobs:
  ide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Checkout pinned companion plugin SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_spell_plugin
          ref: 08ee0045635131d60be06a8a31e0ae8b90d7df65
          path: .qualification/companion-plugin
      - name: Install Qt system library
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install exact desktop tools and candidate
        run: |
          python -m pip install '.[desktop,test]' ruff==0.14.1
          python -m pip install --no-deps ./.qualification/companion-plugin
      - name: Check new client source
        run: |
          python -m ruff check src/openbexi_runtime/spell_server_client.py src/openbexi_ide/spell_server_panel.py tests/test_spell_server_client.py
          python -m ruff format --check src/openbexi_runtime/spell_server_client.py src/openbexi_ide/spell_server_panel.py tests/test_spell_server_client.py
      - name: Build immutable offline Python execution prerequisite
        run: |
          docker build --file docker/Dockerfile.execution --iidfile "$RUNNER_TEMP/execution-image.txt" .
          echo "OPENBEXI_EXECUTION_TEST_IMAGE=$(cat "$RUNNER_TEMP/execution-image.txt")" >> "$GITHUB_ENV"
      - name: Qualify complete existing IDE test suite and client
        run: |
          mkdir -p .qualification/v08-client
          python -m pytest tests -q -W error --tb=short --junitxml=.qualification/v08-client/hosted.xml 2>&1 | tee .qualification/v08-client/hosted.log
      - name: Build and smoke installed client
        run: |
          python -m pip wheel --no-deps . --wheel-dir .qualification/v08-client/wheels
          python -I -m openbexi_runtime.spell_server_client --help
      - name: Retain all qualification outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ide-v08-client-${{ github.sha }}
          path: .qualification/v08-client/
          include-hidden-files: true
          if-no-files-found: error
