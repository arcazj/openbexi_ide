name: Fresh checkout complete IDE verification
on:
  workflow_dispatch:
    inputs:
      spell_commit:
        description: Exact companion SPELL commit for its simulator SDK
        required: false
        type: string
permissions:
  contents: read
jobs:
  ide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.17'
      - name: Checkout pinned companion plugin SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: arcazj/openbexi_spell_plugin
          ref: ${{ inputs.spell_commit || 'a260204f4fb6b64dfe99ff87c8535c29a6ccd69b' }}
          path: .qualification/companion-plugin
      - name: Install Qt system library
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Build and install the canonical desktop wheel
        run: |
          mkdir -p "$RUNNER_TEMP/ide-src" .qualification/v08-client/wheels
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/ide-src"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          python -m pip wheel --no-deps "$RUNNER_TEMP/ide-src" -w .qualification/v08-client/wheels
          wheel=$(find .qualification/v08-client/wheels -name '*.whl')
          sha256sum "$wheel" > .qualification/v08-client/wheel.sha256
          python -m pip install --report .qualification/v08-client/install.json "${wheel}[desktop,test]" ruff==0.14.1
          python -m pip install --no-deps ./.qualification/companion-plugin
      - name: Check new client source
        run: |
          python -m ruff check src/openbexi_runtime/spell_server_client.py src/openbexi_ide/spell_server_panel.py tests/test_spell_server_client.py
          python -m ruff format --check src/openbexi_runtime/spell_server_client.py src/openbexi_ide/spell_server_panel.py tests/test_spell_server_client.py
      - name: Build immutable offline Python execution prerequisite
        run: |
          docker build --file docker/Dockerfile.execution --iidfile "$RUNNER_TEMP/execution-image.txt" .
          echo "OPENBEXI_EXECUTION_TEST_IMAGE=$(cat "$RUNNER_TEMP/execution-image.txt")" >> "$GITHUB_ENV"
      - name: Qualify complete existing IDE test suite and client
        run: |
          mkdir -p .qualification/v08-client
          set -o pipefail
          python -m pytest tests -q -W error --tb=short --junitxml=.qualification/v08-client/hosted.xml 2>&1 | tee .qualification/v08-client/hosted.log
      - name: Smoke installed client
        run: |
          python -I -m openbexi_runtime.spell_server_client --help
      - name: Retain all qualification outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ide-v08-client-${{ github.sha }}
          path: .qualification/v08-client/
          include-hidden-files: true
          if-no-files-found: error
